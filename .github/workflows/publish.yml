name: Build and Deploy
on:
  push:
    branches: [ master ]
  schedule:
    # 10:00 UTC = 12:00 EET (13:00 EEST)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy-html:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1

      - name: Build
        uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: .
          build-command: "make html"

      - name: Deploy HTML
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            BRANCH: gh-pages
            FOLDER: _build/html
            SINGLE_COMMIT: true

  build-and-deploy-pdf:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1

      - name: Build
        uses: ammaraskar/sphinx-action@master
        with:
          docs-folder: .
          pre-build-command: |
            pip install rinohtype
            cp _static/__init__.py /usr/local/lib/python3.8/site-packages/rinoh/language
            cp _static/bg.py /usr/local/lib/python3.8/site-packages/rinoh/language
          build-command: "make rinoh"

      - name: Deploy PDF
        uses: JamesIves/github-pages-deploy-action@3.7.1
        with:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            BRANCH: pdfs
            FOLDER: _build/rinoh
            SINGLE_COMMIT: true
